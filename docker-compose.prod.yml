services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: bestdirection
      # Без запасного значения: пароль обязан быть в .env (аудит 2.13)
      POSTGRES_PASSWORD: ${DB_PASSWORD:?нужен DB_PASSWORD}
      POSTGRES_DB: bestdirection
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestdirection"]
      interval: 5s
      timeout: 5s
      retries: 5
    # На сервере 956 МБ RAM — Postgres надо ограничить, иначе он съест кэш
    # под себя и приложению не останется места.
    mem_limit: 256m
    shm_size: 128m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:?нужен MARKETING_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN:?нужен APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?нужен ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 128m

  app:
    # Образ собирается на раннере GitHub и приезжает готовым: next build берёт
    # до 2 ГБ, на 1 CPU / 956 МБ он бы не прошёл. Локальную сборку можно
    # включить, раскомментировав build.
    image: ${APP_IMAGE:-bestdirection-app:latest}
    # build: .
    restart: unless-stopped
    # Порт наружу не публикуется: снаружи приложение доступно только через Caddy
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://bestdirection:${DB_PASSWORD:?нужен DB_PASSWORD}@db:5432/bestdirection?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?нужен AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?нужен AUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${AUTH_URL}}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:?нужен MARKETING_DOMAIN}
      # Серверные компоненты ходят в api по внутренней сети, мимо Caddy.
      # Внутренний токен заменяет заголовок Origin, которого у таких запросов нет.
      API_INTERNAL_URL: http://api:4000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?нужен INTERNAL_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Без префикса NEXT_PUBLIC_: username отдаётся серверным действием в
      # рантайме, потому что NEXT_PUBLIC_-переменные Next вшивает при сборке,
      # а образ собирается без .env. См. src/actions/telegram-auth-actions.ts.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # SMS-шлюз eskiz.uz. Пустые значения приложение переживает: модуль
      # молча выключается, а не падает.
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
    volumes:
      - uploads:/app/public/uploads
      - private_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  api:
    # Бэкенд на NestJS — перенос с Server Actions (MIGRATION-NESTJS.md). Образ
    # собирается в CI из api/Dockerfile. Снаружи доступен только через Caddy:
    # /api/v2/* на домене CRM.
    image: ${API_IMAGE:?нужен API_IMAGE}
    restart: unless-stopped
    expose:
      - "4000"
    # Каждая переменная перечислена явно: Compose не пробрасывает .env в
    # контейнер сам — так в проде когда-то потерялись Piston и Upstash.
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://bestdirection:${DB_PASSWORD:?нужен DB_PASSWORD}@db:5432/bestdirection?schema=public
      # Тот же секрет, что у app: api читает сессионную куку web
      AUTH_SECRET: ${AUTH_SECRET:?нужен AUTH_SECRET}
      # Откуда разрешены изменяющие запросы (проверка Origin): кабинет и
      # лендинг — с него приходит форма заявки
      APP_URL: ${AUTH_URL:?нужен AUTH_URL}
      MARKETING_URL: https://${MARKETING_DOMAIN:?нужен MARKETING_DOMAIN}
      # Секрет серверных вызовов app → api; деплой создаёт его в .env один раз
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?нужен INTERNAL_TOKEN}
      # Бот целиком в api с этапа 6: и отправка уведомлений, и приём обновлений
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Секрет вебхука: им Telegram подписывает каждое обновление
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Доступ к шлюзу СМС: рассылки и журнал теперь считает api
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      # Каталоги загрузок внутри контейнера — те же тома, что у app
      PUBLIC_UPLOAD_DIR: /app/public/uploads
      PRIVATE_UPLOAD_DIR: /app/uploads
      # Куда стучаться, чтобы сбросить кэш лендинга: по внутренней сети,
      # мимо Caddy (см. /api/internal/revalidate в web)
      APP_INTERNAL_URL: http://app:3000
    volumes:
      # Те же тома, что у app: api принимает картинки, видео и работы учеников,
      # а раздаёт публичные файлы по-прежнему app (src/app/uploads/[...path]).
      # Пути внутри контейнеров совпадают — в базе у файлов работ лежит
      # абсолютный путь, и он должен читаться из обоих.
      - uploads:/app/public/uploads
      - private_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v2/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Замер 2026-09-17: ~115 МБ. На сервере 956 МБ, увеличивать VPS не будем.
    mem_limit: 200m

volumes:
  pgdata:
  uploads:
  private_uploads:
  caddy_data:
  caddy_config:
