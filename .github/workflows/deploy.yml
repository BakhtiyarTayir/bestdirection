name: Deploy to Production

# Образы собираются здесь, а не на сервере: next build берёт до 2 ГБ, а на VPS
# 1 CPU и 956 МБ — сборка там падала бы по памяти. На сервер приезжают готовые
# образы, им нужна память только на запуск.
#
# Порядок: test → build → deploy. Красные проверки — деплоя нет.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два пуша подряд запускали два деплоя одновременно, и оба перезапускали
# контейнер с миграциями. Теперь следующий ждёт, пока закончится текущий.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Одноразовая база для scripts/check-*-db.ts: они создают данные и не
      # убирают их, поэтому только localhost
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bd
          POSTGRES_PASSWORD: bd
          POSTGRES_DB: bd
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U bd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bd:bd@localhost:5439/bd
    steps:
      - uses: actions/checkout@v7

      # Node на раннере старше, чем нужно vitest и api (>= 22.12)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: web — зависимости
        # Клиента Prisma здесь больше нет: с этапа 9 web с базой не
        # разговаривает, схема и миграции принадлежат api
        run: npm ci

      - name: web — типы и линтер
        run: |
          npx tsc --noEmit
          npx eslint

      - name: api — зависимости и клиент Prisma
        working-directory: api
        run: |
          npm ci
          npm run prisma:generate

      # Проверки биллинга, посещаемости и подсчёта баллов уехали в тесты api
      # вместе с их кодом (этапы 3a, 3c и 4). Здесь осталась сама накатка:
      # на чистой базе она ловит битую миграцию до деплоя. Схема у api,
      # поэтому шаг идёт после установки его зависимостей.
      - name: миграции применяются на чистой базе
        working-directory: api
        run: DATABASE_URL="$TEST_DATABASE_URL" npm run db:deploy

      - name: api — типы, линтер, тесты
        # Тесты поднимают свою Postgres через Testcontainers (Docker на раннере есть)
        working-directory: api
        run: |
          npm run typecheck
          npm run lint
          npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      api-image: ${{ steps.meta.outputs.api-image }}
    steps:
      - uses: actions/checkout@v7

      - name: Привести имена образов к нижнему регистру
        id: meta
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "api-image=${REGISTRY}/${IMAGE_NAME,,}-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Логин в ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация web
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Сборка и публикация api
        uses: docker/build-push-action@v7
        with:
          # Контекст — корень: схема Prisma общая. Что в него попадает —
          # api/Dockerfile.dockerignore
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api-image }}:latest
            ${{ steps.meta.outputs.api-image }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ключ SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Сканирование ключа хоста иногда не проходит с первого раза из-за
          # сети раннера, и весь деплой падал на первом же шаге. Повторяем.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              if [ -s ~/.ssh/known_hosts ]; then echo "ключ хоста получен"; break; fi
            fi
            echo "попытка $i не удалась, повтор через 10 секунд"
            sleep 10
          done
          test -s ~/.ssh/known_hosts

      - uses: actions/checkout@v7

      - name: Обновить конфигурацию на сервере
        # .env на сервере не трогаем — там секреты, сгенерированные на месте
        run: |
          scp -i ~/.ssh/id_deploy -o ServerAliveInterval=30 docker-compose.prod.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bestdirection/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -o ServerAliveInterval=30 Caddyfile \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bestdirection/Caddyfile"
          scp -i ~/.ssh/id_deploy -o ServerAliveInterval=30 scripts/backup/backup-db.sh \
            scripts/backup/bestdirection-backup.service scripts/backup/bestdirection-backup.timer \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bestdirection/"

      - name: Подготовить сервер и запустить скачивание образов
        # Скачивание двух образов по 600 МБ идёт минуты, и SSH-канал за это
        # время рвался дважды (13:42 и 13:44 18.09). Поэтому pull уходит в
        # отдельный процесс на сервере (setsid), а CI только опрашивает
        # результат короткими запросами — обрыв связи больше ничего не ломает.
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE
            set -euo pipefail
            cd /opt/bestdirection

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Тег коммита, а не latest: docker compose иначе может оставить
            # закэшированный образ и молча выкатить старую версию.
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${{ needs.build.outputs.image }}:${{ github.sha }}|" .env
            grep -q '^API_IMAGE=' .env || echo 'API_IMAGE=' >> .env
            sed -i "s|^API_IMAGE=.*|API_IMAGE=${{ needs.build.outputs.api-image }}:${{ github.sha }}|" .env

            # Секрет серверных вызовов app → api. Создаётся на сервере один раз
            # и дальше не меняется; в репозитории и в GitHub его нет.
            grep -q '^INTERNAL_TOKEN=' .env || echo "INTERNAL_TOKEN=\$(openssl rand -hex 32)" >> .env

            # Ночной бэкап базы — таймер systemd: cron на сервере не установлен
            chmod 755 backup-db.sh
            install -m 644 bestdirection-backup.service bestdirection-backup.timer /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable --now bestdirection-backup.timer

            # Пароль реестра уже в ~/.docker/config.json — в фоновый скрипт он
            # не попадает. --quiet: прогресс скачивания в лог не нужен.
            rm -f pull.done pull.log
            setsid nohup bash -c 'docker compose pull --quiet; echo \$? > pull.done' \
              > pull.log 2>&1 < /dev/null &
            echo "скачивание запущено"
          REMOTE

      - name: Дождаться образов
        # Каждая проверка — отдельное короткое соединение: если оно оборвётся,
        # следующая попытка просто продолжит ждать, а скачивание идёт своим ходом.
        timeout-minutes: 20
        run: |
          for i in $(seq 1 120); do
            code=$(ssh -i ~/.ssh/id_deploy -o ConnectTimeout=15 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'cat /opt/bestdirection/pull.done 2>/dev/null' || true)
            if [ -n "$code" ]; then
              if [ "$code" = "0" ]; then echo "образы скачаны"; exit 0; fi
              echo "скачивание завершилось с кодом $code" >&2
              ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                'tail -20 /opt/bestdirection/pull.log' || true
              exit 1
            fi
            echo "попытка $i: образы ещё качаются"
            sleep 10
          done
          echo "образы не скачались за 20 минут" >&2
          exit 1

      - name: Перезапустить с новыми образами
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE
            set -euo pipefail
            cd /opt/bestdirection

            # Бэкап до того, как новый контейнер накатит миграции. Не удался —
            # деплой останавливается. На пустом сервере базы ещё нет.
            if docker compose ps --status running --services | grep -qx db; then
              ./backup-db.sh pre-deploy-${{ github.sha }}
            fi

            docker compose up -d --remove-orphans

            # Caddyfile примонтирован файлом: up не перезапускает caddy, если
            # поменялось только содержимое, — перечитываем конфигурацию явно.
            # < /dev/null обязателен: exec -T прокидывает stdin в контейнер, а
            # сам этот скрипт приходит на сервер по stdin — иначе съест остаток
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile < /dev/null

            docker logout ghcr.io

            # Место на диске 20 ГБ, а деплой приносит два образа — чистим чаще
            docker image prune -af --filter "until=72h" || true
          REMOTE

      - name: Проверить, что запустился нужный образ
        # Молчаливый «успешный» деплой уже случался: контейнер оставался на
        # старом образе, а шаг заканчивался без ошибки.
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "EXPECTED_SHA='${{ github.sha }}' bash -s" <<'REMOTE'
            set -euo pipefail
            cd /opt/bestdirection
            for service in app api; do
              image=$(docker inspect "$(docker compose ps -q "$service")" --format '{{.Config.Image}}')
              case "$image" in
                *":$EXPECTED_SHA") echo "$service работает на $image" ;;
                *) echo "$service работает на $image, а ожидался тег $EXPECTED_SHA" >&2; exit 1 ;;
              esac
            done
          REMOTE

      - name: Проверка, что сайт поднялся
        run: |
          # Домен, а не IP: наружу теперь отвечает Caddy, и по IP сертификата нет
          URL="https://${{ secrets.SITE_DOMAIN }}/ru"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then echo "сайт отвечает 200: $URL"; exit 0; fi
            echo "попытка $i: HTTP $code"
            sleep 5
          done
          echo "сайт не ответил 200 за 200 секунд" >&2
          exit 1

      - name: Проверка, что api поднялся
        # С сервера и через Caddy: /api/v2/* маршрутизируется только на домене
        # CRM, а какой домен в SITE_DOMAIN — лендинг или CRM — здесь не важно.
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'REMOTE'
            set -uo pipefail
            domain=$(grep '^APP_DOMAIN=' /opt/bestdirection/.env | cut -d= -f2-)
            url="https://${domain}/api/v2/health"
            for i in $(seq 1 24); do
              if curl -fsS -m 10 "$url" | grep -q '"ok"'; then echo "api отвечает: $url"; exit 0; fi
              echo "попытка $i"
              sleep 5
            done
            echo "api не ответил за 120 секунд: $url" >&2
            exit 1
          REMOTE
