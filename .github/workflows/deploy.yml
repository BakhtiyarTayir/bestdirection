name: Deploy to Production

# Образ собирается здесь, а не на сервере: next build берёт до 2 ГБ, а на VPS
# 1 CPU и 956 МБ — сборка там падала бы по памяти. На сервер приезжает готовый
# образ, ему нужна память только на запуск.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два пуша подряд запускали два деплоя одновременно, и оба перезапускали
# контейнер с миграциями. Теперь следующий ждёт, пока закончится текущий.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Привести имя образа к нижнему регистру
        id: meta
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Логин в ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ключ SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - uses: actions/checkout@v4

      - name: Обновить конфигурацию на сервере
        # .env на сервере не трогаем — там секреты, сгенерированные на месте
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bestdirection/docker-compose.yml"
          scp -i ~/.ssh/id_deploy Caddyfile \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bestdirection/Caddyfile"
          scp -i ~/.ssh/id_deploy scripts/backup/backup-db.sh \
            scripts/backup/bestdirection-backup.service scripts/backup/bestdirection-backup.timer \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bestdirection/"

      - name: Забрать образ и перезапустить
        # GITHUB_TOKEN живёт только на время задания — его хватает, чтобы
        # сервер стянул образ прямо сейчас, и хранить пароль на сервере не надо.
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE
            set -euo pipefail
            cd /opt/bestdirection

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Тег коммита, а не latest: docker compose иначе может оставить
            # закэшированный образ и молча выкатить старую версию.
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${{ needs.build.outputs.image }}:${{ github.sha }}|" .env

            # Ночной бэкап базы — таймер systemd: cron на сервере не установлен
            chmod 755 backup-db.sh
            install -m 644 bestdirection-backup.service bestdirection-backup.timer /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable --now bestdirection-backup.timer

            docker compose pull

            # Бэкап до того, как новый контейнер накатит миграции. Не удался —
            # деплой останавливается. На пустом сервере базы ещё нет.
            if docker compose ps --status running --services | grep -qx db; then
              ./backup-db.sh pre-deploy-${{ github.sha }}
            fi

            docker compose up -d --remove-orphans
            docker logout ghcr.io

            # Место на диске 20 ГБ — старые образы копятся быстро
            docker image prune -af --filter "until=168h" || true
          REMOTE

      - name: Проверка, что развернулся нужный образ
        # Деплой уже проходил «успешно», не перезапустив контейнер: команда
        # внутри скрипта съела его остаток через stdin. Теперь сверяем тег.
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "EXPECTED_SHA='${{ github.sha }}' bash -s" <<'REMOTE'
            set -euo pipefail
            cd /opt/bestdirection
            image=$(docker inspect "$(docker compose ps -q app)" --format '{{.Config.Image}}')
            case "$image" in
              *":$EXPECTED_SHA") echo "app работает на $image" ;;
              *) echo "app работает на $image, а ожидался тег $EXPECTED_SHA" >&2; exit 1 ;;
            esac
          REMOTE

      - name: Проверка, что сайт поднялся
        run: |
          # Домен, а не IP: наружу теперь отвечает Caddy, и по IP сертификата нет
          URL="https://${{ secrets.SITE_DOMAIN }}/ru"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then echo "сайт отвечает 200: $URL"; exit 0; fi
            echo "попытка $i: HTTP $code"
            sleep 5
          done
          echo "сайт не ответил 200 за 200 секунд" >&2
          exit 1
