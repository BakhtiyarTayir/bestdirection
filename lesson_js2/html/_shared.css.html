<style>
:root{
  --ink:#101A28;
  --ink-2:#465771;
  --paper:#E4E9EF;
  --panel:#FFFFFF;
  --line:#C6D0DC;
  --anchor:#1F49D8;
  --moving:#E11D66;
  --sun:#F2B705;
  --grid:rgba(16,26,40,.045);
  --code-bg:#101A28;
  --r:10px;
}
html[data-theme="dark"]{
  --ink:#E8EEF6;
  --ink-2:#9FB0C6;
  --paper:#0D141E;
  --panel:#161F2C;
  --line:#2A3646;
  --anchor:#6E93FF;
  --moving:#FF6E9E;
  --sun:#F7C948;
  --grid:rgba(232,238,246,.045);
  --code-bg:#080D14;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;
  line-height:1.6;
}

.shell{max-width:1080px;margin:0 auto;padding:0 20px 90px}

h1,h2,h3{font-family:"Unbounded","IBM Plex Sans",sans-serif;margin:0;line-height:1.12;letter-spacing:-.02em}
h1{font-size:clamp(28px,5.4vw,52px);font-weight:800}
h2{font-size:clamp(21px,3.2vw,30px);font-weight:700}
h3{font-size:17px;font-weight:600;letter-spacing:0}
p{margin:14px 0 0}
code,kbd,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
:not(pre)>code{
  font-size:.9em;background:rgba(31,73,216,.09);color:var(--anchor);
  padding:2px 6px;border-radius:5px
}
html[data-theme="dark"] :not(pre)>code{background:rgba(110,147,255,.14)}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2)
}

header{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.lede{max-width:58ch;margin-top:22px;font-size:clamp(17px,2vw,20px);color:var(--ink-2)}
.lede b{color:var(--ink);font-weight:600}

section{padding:52px 0;border-bottom:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.sec-num{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--moving);font-weight:500}
.sec-sub{max-width:62ch;color:var(--ink-2);margin-top:10px}
.body-copy{max-width:62ch}

pre.code{
  margin:18px 0 0;background:var(--code-bg);color:#D8E2EF;border-radius:var(--r);
  padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.75;
  font-family:"IBM Plex Mono",monospace;
}
pre.code b{font-weight:400}
.s{color:#7FE3C0}.k{color:#8FB6FF}.v{color:#FFD98A}.c{color:#6B7C93;font-style:italic}.p{color:#8494A8}.bad{color:#FF8FAE}

.explain{border-left:3px solid var(--moving);padding:2px 0 2px 16px;margin-top:20px;max-width:62ch}
.explain h3{margin-bottom:6px}
.explain p{margin:0;color:var(--ink-2);font-size:14.5px}

.warn{
  background:rgba(242,183,5,.12);border:1px solid rgba(242,183,5,.5);
  border-radius:var(--r);padding:14px 16px;font-size:14.5px;margin-top:20px;max-width:64ch
}
.warn b{font-weight:600}

/* ---------- интерактивные панели ---------- */
.lab{
  margin-top:24px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:20px
}
.lab-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:16px
}
.lab-title{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.lab-hint{font-size:13px;color:var(--ink-2)}

button.act{
  font-family:"IBM Plex Sans",sans-serif;font-size:14px;font-weight:500;
  background:var(--anchor);color:#fff;border:0;border-radius:8px;
  padding:9px 15px;cursor:pointer;transition:transform .12s,filter .12s
}
button.act:hover{filter:brightness(1.1)}
button.act:active{transform:translateY(1px)}
button.act.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
button.act.pink{background:var(--moving)}
button.act[disabled]{opacity:.45;cursor:not-allowed}

.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.counter{
  border:1px solid var(--line);border-radius:var(--r);padding:16px;
  background:var(--paper);position:relative
}
.counter .name{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.counter .val{font-family:"IBM Plex Mono",monospace;font-size:46px;font-weight:500;line-height:1;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.counter .env{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--anchor);
  background:rgba(31,73,216,.08);border-radius:6px;padding:6px 8px;margin-bottom:12px
}
html[data-theme="dark"] .counter .env{background:rgba(110,147,255,.12)}
.counter .row{display:flex;gap:8px}

.console{
  margin-top:16px;background:var(--code-bg);border-radius:var(--r);padding:14px 16px;
  font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.7;color:#D8E2EF;
  min-height:76px;max-height:230px;overflow-y:auto
}
.console .ln{display:block;white-space:pre-wrap;word-break:break-word}
.console .ln.out::before{content:"› ";color:#6B7C93}
.console .ln.err{color:#FF8FAE}
.console .ln.ok{color:#7FE3C0}
.console .empty{color:#6B7C93;font-style:italic}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{
  font-family:"IBM Plex Mono",monospace;font-size:13px;background:transparent;color:var(--ink-2);
  border:0;padding:8px 14px;cursor:pointer
}
.seg button.on{background:var(--anchor);color:#fff}

.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.field label{font-size:13.5px;color:var(--ink-2)}
.field input[type=range]{width:190px;accent-color:var(--anchor)}
.field input[type=number],.field input[type=text]{
  font-family:"IBM Plex Mono",monospace;font-size:14px;padding:7px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:110px
}
.badge{
  font-family:"IBM Plex Mono",monospace;font-size:12px;padding:3px 9px;border-radius:20px;
  background:rgba(31,73,216,.1);color:var(--anchor)
}
.badge.pink{background:rgba(225,29,102,.1);color:var(--moving)}
.badge.sun{background:rgba(242,183,5,.16);color:#8A6A00}
html[data-theme="dark"] .badge.sun{color:var(--sun)}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:14px}
.tbl th,.tbl td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.tbl td:first-child{font-family:"IBM Plex Mono",monospace;color:var(--moving);white-space:nowrap}
.tbl-wrap{overflow-x:auto}

.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.task{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sun);border-radius:var(--r);padding:16px}
.task .mono{font-size:11px;color:#8A6A00;letter-spacing:.1em;text-transform:uppercase}
html[data-theme="dark"] .task .mono{color:var(--sun)}
.task p{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.task pre.code{font-size:12.5px;margin-top:10px}

details.q{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:0;margin-top:10px;overflow:hidden
}
details.q>summary{
  cursor:pointer;padding:14px 16px;font-weight:600;font-size:15px;list-style:none;
  display:flex;gap:10px;align-items:flex-start
}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::before{
  content:"+";font-family:"IBM Plex Mono",monospace;color:var(--moving);flex:none;font-weight:500
}
details.q[open]>summary::before{content:"–"}
details.q .answer{padding:0 16px 16px 38px;color:var(--ink-2);font-size:14.5px}
details.q .answer p:first-child{margin-top:0}

ol.hw{max-width:64ch;padding-left:22px;margin-top:14px}
ol.hw li{margin-bottom:14px;color:var(--ink-2)}
ol.hw li b{color:var(--ink)}
ul.goals{max-width:64ch;padding-left:22px;margin-top:14px;color:var(--ink-2)}
ul.goals li{margin-bottom:7px}

footer{padding:40px 0;color:var(--ink-2);font-size:13.5px}
:focus-visible{outline:2px solid var(--moving);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media(max-width:640px){
  .counter .val{font-size:36px}
}
</style>
